<!doctype html>
<html lang="nl">
<head>

<style>

  .merk { display: flex; align-items: center; gap: 14px; margin-bottom: 38px; }
  .merk svg { height: 30px; width: auto; }
  .merk span { font-size: 24px; font-weight: 500; letter-spacing: -0.01em; }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 500;
    font-size: 74px; line-height: 1.04; letter-spacing: -0.015em;
    text-align: center; margin: 0;
  }
  h1 em { color: #628f69; font-style: italic; }
  .url { position: absolute; bottom: 40px; font-size: 19px; color: rgba(15, 23, 42, 0.5); letter-spacing: 0.01em; }

  <div class="merk">
    <svg viewBox="327 375 407 250" xmlns="http://www.w3.org/2000/svg" fill="#0f172a">
