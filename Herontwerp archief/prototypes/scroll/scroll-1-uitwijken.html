<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll 1 uitwijken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../stijl/tokens.css">
<link rel="stylesheet" href="scroll-core.css">
<style>
  /* Slogan en acties: komen op zodra het logo naar links is geschoven */
  .copy {
    position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none;
    --q: clamp(0, calc((var(--p) - .55) * 4), 1);
    opacity: var(--q);
    will-change: transform;
  }
  .copy-in { transform: translateY(calc(14px - 14px * var(--q))); }
  .copy.is-live { pointer-events: auto; }
  .slogan { font-family: var(--serif); font-weight: 600; line-height: 1.1; letter-spacing: -.01em; font-size: clamp(28px, 2.9vw, 44px); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 30px; margin-top: 32px; }
  @media (max-width: 760px) {
    .copy { left: 0 !important; right: 0; text-align: center; padding: 0 var(--gutter); }
    .actions { justify-content: center; }
  }
</style>
</head>
<body>

<section class="pin" id="pin">
  <div class="stage" id="stage">
    <div class="copy" id="copy">
      <div class="copy-in">
        <h1 class="slogan">At the core of innovation</h1>
        <div class="actions">
          <a class="btn" href="#">Book a call <span class="arr">→</span></a>
          <a class="tlink" href="#">See our work <span class="arr">→</span></a>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="next">
  <div class="wrap reveal">
    <p class="eyebrow">Selected work · Croes NV</p>
    <p class="big">From paper delivery notes <em>to a real time overview.</em></p>
  </div>
</section>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script src="scroll-core.js"></script>
<script>
  // Idee 1: bij het scrollen schuift het logo naar links en verschijnen de pijlers rechts,
  // met de slogan en de acties eronder
  const copy = document.getElementById('copy');

  TriaHero({
    scroll: 1.3,
    frame(c) {
      if (c.mobile) return;  // op een gsm blijft het logo in het midden
      const e = c.E.inout(c.clamp(c.p / 0.8));
      const dist = c.base.dist / c.lerp(1, 0.86, e);   // iets kleiner
      const ppu = c.ppuAt(dist);
      const wL = c.LOGO_W * ppu;
      const cx = c.lerp(c.W / 2, c.left + wL / 2, e);
      const cy = c.lerp(c.base.cy, c.H * 0.4, e);
      const camX = (c.W / 2 - cx) / ppu, camY = (cy - c.H / 2) / ppu;
      c.camPos.set(camX, camY, dist);
      c.aim.set(camX, camY, 0);
      c.guidesShown = c.p > 0.45;
      c.labelX = c.left + wL + c.clamp(c.W * 0.09, 90, 180);
    },
    overlay(c) {
      const m = c.bars[0].mesh;
      const [xs] = c.project(m.position.x - c.BAR_W / 2, m.position.y, c.DEPTH / 2);
      const [, yb] = c.project(0, -c.DY - c.BAR_H / 2, c.DEPTH / 2);
      copy.style.left = c.mobile ? '0px' : `${xs}px`;
      copy.style.transform = `translate3d(0, ${yb + 56}px, 0)`;
      copy.classList.toggle('is-live', c.p > 0.8);
    },
  });
</script>
</body>
</html>
