<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lettertype varianten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:opsz,wght@9..40,300..700&family=Space+Grotesk:wght@300..700&family=Inter+Tight:wght@300..700&family=Geist:wght@300..700&family=Manrope:wght@300..700&family=Plus+Jakarta+Sans:wght@300..700&family=Sora:wght@300..700&family=Instrument+Sans:wght@400..700&family=Schibsted+Grotesk:wght@400..700&family=Archivo:wdth,wght@62..125,300..700&display=swap" rel="stylesheet">
<style>
/* Tien lettertypes voor wat groot binnen een sectie staat, getoond op "Onze oplossingen".
   De sectietitel blijft Playfair Display, de uitleg DM Sans, de nummers Space Grotesk. Los van de site. */
:root {
  --green: #628F69; --green-dim: #557A5B; --navy: #0F172A; --bg: #F2F2F2; --line: #D9D9D6;
  --sub: rgba(15, 23, 42, .62);
  --serif: "Playfair Display", Georgia, serif; --sans: "DM Sans", system-ui, sans-serif; --brand: "Space Grotesk", "DM Sans", sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1); --dur: 420ms;
  --gutter: clamp(16px, 5vw, 64px);
  --w: 500;   /* het gewicht van de grote namen, de knoppen bovenaan zetten het */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--navy); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

/* bovenaan: uitleg, snel naar een variant, en het gewicht kiezen */
.bar {
  position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
  padding: 14px var(--gutter); background: rgba(242, 242, 242, .9); border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  font-family: var(--brand); font-weight: 500; font-size: 13px;
}
.bar nav { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.bar nav a { color: var(--sub); }
.bar nav a:hover { color: var(--navy); }
.weights { display: flex; align-items: center; gap: 6px; margin-left: auto; color: var(--sub); }
.weights button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--navy); cursor: pointer; }
.weights button.on { background: var(--navy); color: #fff; border-color: var(--navy); }

.intro { max-width: 1640px; margin: 0 auto; padding: 56px var(--gutter) 0; }
.intro h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(32px, 3.6vw, 48px); letter-spacing: -.01em; }
.intro p { margin-top: 10px; max-width: 46em; color: var(--sub); font-size: 17px; line-height: 1.5; }

/* één variant */
.variant { max-width: 1640px; margin: 0 auto; padding: 88px var(--gutter) 0; scroll-margin-top: 40px; }
.v-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 14px 18px; margin-bottom: 40px; background: #E8E8E5; border-radius: 10px; }
.v-head b { font-family: var(--brand); font-weight: 600; font-size: 14px; color: var(--green-dim); }
.v-head h2 { font-family: var(--brand); font-weight: 600; font-size: 17px; }
.v-head span { color: var(--sub); font-size: 15px; }
.v-head i { font-style: normal; margin-left: auto; font-family: var(--brand); font-weight: 500; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #fff; color: var(--sub); }

/* de sectie zelf, zoals in Hero V2 */
.sol-title { font-family: var(--serif); font-weight: 600; line-height: 1.04; letter-spacing: -.015em; font-size: clamp(34px, 4.6vw, 64px); margin-bottom: clamp(28px, 3vw, 48px); }
.sol-list { list-style: none; }
.sol {
  position: relative; display: grid; grid-template-columns: minmax(16em, 1fr) auto minmax(0, 1.6fr);
  align-items: stretch; gap: clamp(24px, 3vw, 56px);
  min-height: clamp(180px, 17vw, 270px); padding: 24px 0 30px; border-top: 1px solid var(--line);
}
.sol-list li:last-child .sol { border-bottom: 1px solid var(--line); }
.sol::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; z-index: 1; background: var(--green);
  transform: scaleX(0); transform-origin: left center; transition: transform var(--dur) var(--ease);
}
.sol:hover::before { transform: scaleX(1); }
.sol-info { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
.sol-text { font-family: var(--sans); font-size: clamp(17px, 1.25vw, 20px); line-height: 1.4; max-width: 20em; }
.sol-num { font-family: var(--brand); font-weight: 500; font-size: 14px; letter-spacing: .04em; color: var(--sub); transition: color var(--dur) var(--ease); }
.sol-mark {
  align-self: start; margin-top: 10px; width: clamp(110px, 11vw, 190px); aspect-ratio: 291.56 / 48.57;
  border-radius: 999px; background: #E3E3E0; transition: background var(--dur) var(--ease);
}
.sol-mark.m2 { transform: translateX(39.5%); }
.sol-name {
  justify-self: end; align-self: start; text-align: right;
  font-family: var(--f); font-weight: var(--w); line-height: var(--lh, 1); letter-spacing: var(--ls, -.03em);
  font-stretch: var(--fs, 100%); font-size: clamp(44px, 5.6vw, 108px);
  transition: transform var(--dur) var(--ease);
}
.sol:hover .sol-mark { background: rgba(98, 143, 105, .55); }
.sol:hover .sol-num { color: var(--green-dim); }
.sol:hover .sol-name { transform: translateX(-8px); }

/* de referentie: zoals het nu is */
.v0 .sol-name { font-weight: 600; letter-spacing: -.02em; line-height: .98; }

@media (max-width: 899px) {
  .sol { grid-template-columns: 1fr; gap: 18px; min-height: 0; }
  .sol-name { order: -1; justify-self: start; text-align: left; font-size: clamp(36px, 10vw, 60px); }
  .sol-mark { display: none; }
  .weights { margin-left: 0; }
}
.end { height: 160px; }
</style>
</head>
<body>

<div class="bar">
  <nav id="jump"></nav>
  <div class="weights" role="group" aria-label="Gewicht">Gewicht
    <button type="button" data-w="400">400</button><button type="button" data-w="500" class="on">500</button><button type="button" data-w="600">600</button>
  </div>
</div>

<header class="intro">
  <h1>Lettertypes binnen een sectie</h1>
  <p>Telkens "Onze oplossingen.": de titel in Playfair Display, de uitleg in DM Sans, de nummers in Space Grotesk. Alleen de grote namen veranderen. Bovenaan kies je het gewicht van die namen. Beweeg over een rij voor de hover.</p>
</header>

<main id="variants"></main>
<div class="end"></div>

<script>
  // nummer, naam, lettertype, karakter, of het al in gebruik is, en eventuele fijnafstelling
  const FONTS = [
    [0, 'Playfair Display', '"Playfair Display", serif', 'Zoals het nu is, ter vergelijking.', 'nu', {}],
    [1, 'DM Sans', '"DM Sans", sans-serif', 'Dezelfde familie als de uitleg, groot en dicht op elkaar. Rustig, zakelijk, de minste stijlbreuk.', 'al in gebruik', {}],
    [2, 'Space Grotesk', '"Space Grotesk", sans-serif', 'Technisch, met eigenzinnige letters (g, a, t). Het meest Palantir.', 'al in gebruik', {}],
    [3, 'Inter Tight', '"Inter Tight", sans-serif', 'Neutraal en strak, de standaard van moderne techbedrijven. Smal gezet, dus sterk in groot formaat.', 'nieuw', {}],
    [4, 'Geist', '"Geist", sans-serif', 'Van Vercel: geometrisch en precies, met een kleine Zwitserse toets. Heel clean.', 'nieuw', {}],
    [5, 'Manrope', '"Manrope", sans-serif', 'Modern en open, licht afgerond. Vriendelijker dan Inter, nog steeds zakelijk.', 'nieuw', {}],
    [6, 'Plus Jakarta Sans', '"Plus Jakarta Sans", sans-serif', 'Elegant en wat warmer, met een hoge x-hoogte. Gaat mooi samen met een serif.', 'nieuw', {}],
    [7, 'Sora', '"Sora", sans-serif', 'Geometrisch en breed, voelt als software. Uitgesproken.', 'nieuw', { ls: '-.04em' }],
    [8, 'Instrument Sans', '"Instrument Sans", sans-serif', 'Strak met een licht condensed karakter. Redactioneel, zoals een modern magazine.', 'nieuw', {}],
    [9, 'Schibsted Grotesk', '"Schibsted Grotesk", sans-serif', 'Een krantengrotesk: degelijk, betrouwbaar, met wat karakter in de letters.', 'nieuw', {}],
    [10, 'Archivo, smal', '"Archivo", sans-serif', 'Een grotesk in een smalle breedte: zakelijk en krachtig, past veel in weinig ruimte. Architectuurbureau-gevoel.', 'nieuw', { fs: '82%', ls: '-.02em' }],
  ];
  const ROWS = [
    ['Software op maat rond je processen. Mobiele apps voor wie buiten werkt, alles op één centraal platform, en koppelingen met je ERP.', 'Custom oplossingen'],
    ['AI die antwoordt en voorstelt zoals jouw bedrijf werkt, op je eigen gegevens.', 'AI-integratie'],
    ['Je team leert AI inzetten met de kennis van jullie bedrijf.', 'Workshops'],
  ];
  const nr = n => String(n).padStart(2, '0');
  document.getElementById('jump').innerHTML = FONTS.map(([n, name]) => `<a href="#v${n}">${nr(n)} ${name}</a>`).join('');
  document.getElementById('variants').innerHTML = FONTS.map(([n, name, family, about, tag, tune]) => {
    const vars = `--f:${family};` + (tune.ls ? `--ls:${tune.ls};` : '') + (tune.fs ? `--fs:${tune.fs};` : '');
    return `
    <section class="variant v${n}" id="v${n}" style='${vars}'>
      <div class="v-head"><b>${nr(n)}</b><h2>${name}</h2><span>${about}</span><i>${tag}</i></div>
      <h3 class="sol-title">Onze oplossingen.</h3>
      <ol class="sol-list">${ROWS.map(([text, title], i) => `
        <li><a class="sol" href="#v${n}">
          <div class="sol-info"><p class="sol-text">${text}</p><span class="sol-num">/0${i + 1}</span></div>
          <span class="sol-mark m${i + 1}"></span>
          <span class="sol-name">${title}</span>
        </a></li>`).join('')}
      </ol>
    </section>`;
  }).join('');
  // het gewicht van de grote namen (de referentie blijft zoals ze is)
  document.querySelector('.weights').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.documentElement.style.setProperty('--w', b.dataset.w);
    document.querySelectorAll('.weights button').forEach(x => x.classList.toggle('on', x === b));
  });
</script>
</body>
</html>
