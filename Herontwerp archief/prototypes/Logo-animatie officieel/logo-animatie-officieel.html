<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo animatie officieel</title>
<style>
  /* De officiële logo-animatie: enkel het titanium logo op het donkere blauw, niets errond.
     De intro is exact die uit ../scroll/scroll-core.js, losgemaakt zodat deze versie niet
     meeverandert met de scrollvarianten. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05080F; overflow: hidden; }
  .stage {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 70% at 50% 42%, #152036 0%, #0B1220 48%, #05080F 100%);
  }
  .gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .veil {
    position: absolute; inset: 0; background: #05080F; pointer-events: none;
    opacity: 1; transition: opacity 2200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .stage.is-on .veil { opacity: 0; }
  .stage.is-fast .veil { transition-duration: 500ms; }
  .stage.is-still .veil { transition: none; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas class="gl" aria-label="Het TriaCore AI logo in licht titanium: drie balken"></canvas>
  <div class="veil"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from 'three';

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;

  // Een easing zoals cubic-bezier() in CSS
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t;
    const sy = t => ((ay * t + by) * t + cy) * t;
    const dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const e = sx(t) - x, d = dx(t);
        if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
        t -= e / d;
      }
      return sy(clamp(t));
    };
  }
  const E = {
    glide: bezier(0.37, 0, 0.22, 1),   // traag vertrekken, lang uitglijden
    soft: bezier(0.4, 0, 0.2, 1),
  };

  // Het logo, in eenheden van 100 uit de originele SVG
  const BAR_W = 2.9156, BAR_H = 0.4857, DX = 0.5758, DY = 1.00445;
  const BARS = [{ x: -DX, y: DY }, { x: DX, y: 0 }, { x: -DX, y: -DY }];
  const LOGO_H = 2 * DY + BAR_H, LOGO_W = 2 * DX + BAR_W;
  const DEPTH = 0.2, BEVEL = 0.035;
  const FOV = 26;

  const T_CAM = 5.6;              // de camera glijdt van de rand naar het volledige logo
  const T_END = T_CAM + 0.4;      // daarna staat ook de lichtstreep stil

  const stage = document.getElementById('stage');
  const canvas = stage.querySelector('.gl');

  // ?t=3 zet de animatie vast op seconde 3 (om stilstaande beelden te controleren)
  const fixed = new URLSearchParams(location.search).get('t');
  const still = fixed !== null && !Number.isNaN(parseFloat(fixed));

  // ---------- Three.js ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: still });
  let dpr = Math.min(window.devicePixelRatio, 1.75);
  renderer.setPixelRatio(dpr);
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();

  // een donkere studio met lichtstroken: dat is wat het metaal weerspiegelt
  const studio = new THREE.Scene();
  studio.background = new THREE.Color(0x06090f);
  const strip = (w, h, k, x, y, z) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide })
    );
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    studio.add(m);
  };
  strip(14, 0.9, 7, 0, 6, 3);
  strip(0.8, 9, 4.5, -7, 0.5, 2);
  strip(0.6, 9, 3, 7.5, 0, -1);
  strip(18, 2.5, 1.3, 0, -6, 5);
  strip(5, 3.5, 2.2, 0, 1, 9);
  const env = new THREE.PMREMGenerator(renderer).fromScene(studio, 0.02).texture;

  // de drie balken: afgeronde staven met een fijne afschuining
  const shape = (() => {
    const w = BAR_W - 2 * BEVEL, h = BAR_H - 2 * BEVEL, r = h / 2, x0 = -w / 2 + r, x1 = w / 2 - r;
    const s = new THREE.Shape();
    s.moveTo(x0, -r);
    s.lineTo(x1, -r);
    s.absarc(x1, 0, r, -Math.PI / 2, Math.PI / 2, false);
    s.lineTo(x0, r);
    s.absarc(x0, 0, r, Math.PI / 2, Math.PI * 1.5, false);
    return s;
  })();
  const barGeo = new THREE.ExtrudeGeometry(shape, {
    depth: DEPTH, bevelEnabled: true, bevelThickness: BEVEL, bevelSize: BEVEL, bevelSegments: 10, curveSegments: 48,
  });
  barGeo.center();

  const bars = BARS.map(b => {
    const mat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color('#F2F2F2'), metalness: 1, roughness: 0.3,
      anisotropy: 0.45, envMap: env, envMapIntensity: 1.2,
    });
    const mesh = new THREE.Mesh(barGeo, mat);
    mesh.position.set(b.x, b.y, 0);
    scene.add(mesh);
    return mat;
  });

  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.03, 4000);
  const tn = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  const camPath = new THREE.CatmullRomCurve3([new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], false, 'centripetal');
  const aimPath = new THREE.CatmullRomCurve3([new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], false, 'centripetal');
  const camPos = new THREE.Vector3(), aim = new THREE.Vector3();
  let W = 0, H = 0;

  function layout() {
    W = stage.clientWidth; H = stage.clientHeight;
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();

    // het eindbeeld: het logo in het midden, een kwart van de hoogte.
    // Anders dan in de scrollvarianten staat er geen naam onder, dus het logo staat exact in het midden.
    const dist = Math.max(LOGO_H / (0.25 * 2 * tn), LOGO_W / (0.6 * 2 * tn * camera.aspect));

    camPath.points[0].set(1.75, 1.32, 0.62);
    camPath.points[1].set(1.6, 0.55, dist * 0.32);
    camPath.points[2].set(0, 0, dist);
    aimPath.points[0].set(0.15, 1.0, 0);
    aimPath.points[1].set(0.1, 0.25, 0);
    aimPath.points[2].set(0, 0, 0);
    camPath.updateArcLengths();
    aimPath.updateArcLengths();
  }

  // ---------- De lus ----------
  const upStart = new THREE.Vector3(0.22, 1, 0).normalize();
  const upEnd = new THREE.Vector3(0, 1, 0);
  let t = 0, fast = false, running = false, last = 0, slow = 1 / 60;

  function draw() {
    const e = E.glide(clamp(t / T_CAM));
    camPath.getPointAt(e, camPos);
    aimPath.getPointAt(e, aim);
    camera.up.copy(upStart).lerp(upEnd, e).normalize();
    camera.position.copy(camPos);
    camera.lookAt(aim);

    // de lichtstreep over het metaal
    const sweep = lerp(-1.6, 0.32, E.soft(clamp(t / T_END)));
    bars.forEach(mat => mat.envMapRotation.set(0, sweep, 0));

    renderer.render(scene, camera);
  }

  function frame(now) {
    const raw = (now - last) / 1000;
    const dt = Math.min(0.05, raw);
    last = now;
    t += dt * (fast ? 7 : 1);

    // haalt de computer de 60 beelden per seconde niet, dan iets minder pixels
    if (raw < 0.25) slow = lerp(slow, raw, 0.05);
    if (slow > 1 / 45 && dpr > 1) {
      dpr = Math.max(1, dpr - 0.25);
      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H, false);
      slow = 1 / 60;
    }

    draw();
    // na het eindbeeld rekent de computer niet meer door
    if (t < T_END) requestAnimationFrame(frame);
    else { running = false; fast = false; }
  }

  function play() {
    t = 0; fast = false;
    stage.classList.remove('is-on', 'is-fast');
    void stage.offsetWidth;   // de sluier begint opnieuw vanaf zwart
    stage.classList.add('is-on');
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
  }

  // tijdens de intro: klik of toets spoelt door. Na de intro: klik of R speelt opnieuw af.
  function onInput(e) {
    if (still) return;
    if (e.type === 'keydown' && (e.key === 'r' || e.key === 'R') && !running) return play();
    if (running && t < T_CAM) { fast = true; stage.classList.add('is-fast'); }
    else if (!running && e.type === 'pointerdown') play();
  }
  window.addEventListener('pointerdown', onInput);
  window.addEventListener('keydown', onInput);
  window.addEventListener('resize', () => { layout(); if (!running) draw(); });

  layout();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still || reduce) {
    t = still ? clamp(parseFloat(fixed), 0, T_END) : T_END;
    stage.classList.add('is-still', 'is-on');
    draw();
  } else {
    play();
  }
</script>
</body>
</html>
