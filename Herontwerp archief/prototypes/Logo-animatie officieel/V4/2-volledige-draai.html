<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo animatie V4 2 volledige draai</title>
<link rel="stylesheet" href="v4-core.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas class="gl" aria-label="Het TriaCore AI logo in licht titanium: drie balken"></canvas>
  <div class="veil"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script src="v4-core.js"></script>
<script>
  // 2. Volledige draai: elke balk begint met zijn achterkant naar je toe en maakt een halve
  // slag om zijn lengteas, na elkaar van boven naar onder. Je ziet het metaal twee keer oplichten.
  const STAGGER = 0.24, TURN = 1.9;
  TriaLogoV4({
    dur: 3.4,
    finale(c, s) {
      c.bars.forEach((m, i) => {
        const k = c.E.glide(c.clamp((s - i * STAGGER) / TURN));
        m.rotation.x = c.rad(-180) * (1 - k);
        c.glint[i] = 0.5 * Math.sin(2 * Math.PI * k);
      });
    },
  });
</script>
</body>
</html>
