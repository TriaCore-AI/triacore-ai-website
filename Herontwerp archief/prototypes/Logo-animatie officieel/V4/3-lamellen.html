<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo animatie V4 3 lamellen</title>
<link rel="stylesheet" href="v4-core.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas class="gl" aria-label="Het TriaCore AI logo in licht titanium: drie balken"></canvas>
  <div class="veil"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script src="v4-core.js"></script>
<script>
  // 3. Lamellen: elke balk staat eerst dwars, op zijn kant, zodat je enkel zijn uiteinde ziet.
  // Na elkaar draaien ze rond hun eigen verticale as open, als lamellen, tot het logo staat.
  const STAGGER = 0.26, TURN = 1.6;
  TriaLogoV4({
    dur: 3.2,
    finale(c, s) {
      c.bars.forEach((m, i) => {
        const k = c.E.glide(c.clamp((s - i * STAGGER) / TURN));
        m.rotation.y = c.rad(84) * (1 - k);
        c.glint[i] = 0.6 * Math.sin(Math.PI * k);
      });
    },
  });
</script>
</body>
</html>
