<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo animatie V2 B kwartslag</title>
<link rel="stylesheet" href="v2-core.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas class="gl" aria-label="Het TriaCore AI logo in licht titanium: drie balken"></canvas>
  <div class="veil"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script src="v2-core.js"></script>
<script>
  // B. Kwartslag: het logo staat bijna op zijn zijkant, sterk verkort. In één vloeiende
  // draai rond de verticale as keert het geheel naar je toe.
  TriaLogoV2({
    dur: 2.8,
    finale(c, s) {
      const k = c.E.glide(c.clamp(s / 2.7));
      c.group.rotation.y = c.rad(-80) * (1 - k);
    },
  });
</script>
</body>
</html>
