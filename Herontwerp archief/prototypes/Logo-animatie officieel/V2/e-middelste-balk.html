<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo animatie V2 E middelste balk</title>
<link rel="stylesheet" href="v2-core.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas class="gl" aria-label="Het TriaCore AI logo in licht titanium: drie balken"></canvas>
  <div class="veil"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script src="v2-core.js"></script>
<script>
  // E. De middelste balk sluit aan: boven en onder staan al op hun plek. De middelste balk
  // draait binnen vanuit de diepte, rechts achteraan, en schuift op zijn plek: vertalen, de brug.
  TriaLogoV2({
    dur: 2.9,
    finale(c, s) {
      const k = c.E.glide(c.clamp((s - 0.15) / 2.6));
      const m = c.bars[1];
      m.position.x += c.lerp(2.2, 0, k);
      m.position.z = c.lerp(-5, 0, k);
      m.rotation.y = c.rad(55) * (1 - k);
      c.glint[1] = 0.5 * Math.sin(Math.PI * k);
    },
  });
</script>
</body>
</html>
