<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo animatie V6 08 monolieten</title>
<link rel="stylesheet" href="v6-core.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas class="gl" aria-label="Het TriaCore AI logo in licht titanium: drie balken"></canvas>
  <div class="veil"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="v6-core.js"></script>
<script>
  // 08. Monolieten: het logo zweeft in een donkere, architecturale ruimte. Drie enorme, matte
  // zuilen staan in de verte, alleen langs hun randen belicht.
  TriaLogoV6({
    setup(c) {
      const { THREE } = c;
      c.scene.fog = new THREE.Fog(0x0B1220, 12, 64);
      const mat = new THREE.MeshStandardMaterial({
        color: '#1c2536', metalness: 0.6, roughness: 0.35, envMap: c.env, envMapIntensity: 0.9,
      });
      [[-10, -18, 0.35], [4, -30, -0.2], [13, -16, -0.5]].forEach(([x, z, ry]) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(2.6, 44, 2.6), mat);
        m.position.set(x, 0, z);
        m.rotation.y = ry;
        c.scene.add(m);
      });
    },
  });
</script>
</body>
</html>
