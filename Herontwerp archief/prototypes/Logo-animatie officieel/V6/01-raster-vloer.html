<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo animatie V6 01 raster als vloer</title>
<link rel="stylesheet" href="v6-core.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas class="gl" aria-label="Het TriaCore AI logo in licht titanium: drie balken"></canvas>
  <div class="veil"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="v6-core.js"></script>
<script>
  // 01. Raster als vloer: een fijn raster van dunne lijnen onder het logo, alsof het in een
  // ruimte zweeft. Het vervaagt naar de verte, en in het eindbeeld valt het bijna weg.
  TriaLogoV6({
    setup(c) {
      const { THREE } = c;
      c.scene.fog = new THREE.Fog(0x0B1220, 8, 46);
      const grid = new THREE.GridHelper(160, 160, 0xffffff, 0xffffff);
      grid.material.transparent = true;
      grid.material.opacity = 0.08;
      grid.material.depthWrite = false;
      grid.position.y = -2.2;
      c.scene.add(grid);
      c.grid = grid;
    },
    frame(c, f) {
      c.grid.material.opacity = f.shot === 2 ? c.lerp(0.08, 0.03, c.E.soft(f.k)) : 0.08;
    },
  });
</script>
</body>
</html>
