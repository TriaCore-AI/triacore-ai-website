[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Vite geeft elk gebouwd bestand in /assets een unieke naam per versie: browsers mogen ze dus een jaar bewaren
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
